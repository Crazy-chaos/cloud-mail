name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloudmail"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "kv"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "r2"
bucket_name = "REPLACE_WITH_R2_BUCKET_NAME"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/30 * * * *", "0 16 * * *"]

[vars]
# Do not commit production values here.
# Generate wrangler.generated.toml from environment variables before deploying.

[build]
command = "npm --prefix ../mail-vue install --legacy-peer-deps && npm --prefix ../mail-vue run build"
